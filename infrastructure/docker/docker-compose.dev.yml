# SDMAS v2 — Development Docker Compose
# Usage: docker compose -f infrastructure/docker/docker-compose.dev.yml up -d

name: sdmas-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdmas
      POSTGRES_PASSWORD: sdmas_dev
      POSTGRES_DB: sdmas
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdmas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://sdmas:sdmas_dev@postgres:5432/sdmas
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-do-not-use-in-production
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ../../apps/api/app
          action: sync
          target: /app/app
        - path: ../../apps/api/pyproject.toml
          action: rebuild

volumes:
  postgres_dev_data:
