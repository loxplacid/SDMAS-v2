# SDMAS v2 — OpenTelemetry Collector Configuration

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes:
    actions:
      - key: environment
        value: "${ENVIRONMENT}"
        action: upsert
      - key: service.name
        value: "sdmas-api"
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: sdmas
    const_labels:
      environment: "${ENVIRONMENT}"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
