# =============================================================
# SDMAS v2 — Development Nginx Configuration
# =============================================================
# This config is used by the `docker compose up --build` zero-touch
# experience.  It serves the built SPA and proxies /api/ to the
# FastAPI backend.  No SSL, no HTTPS redirect, no rate limiting.
# For production, see infrastructure/nginx/nginx.conf.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens off;

    # ---- Health check (no auth) ----
    server {
        listen 80 default_server;
        server_name _;

        location /health-check {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- API Proxy ----
        # The frontend calls the backend with BOTH `/api/...` paths and bare
        # API prefixes (`/auth/login`, `/students`, `/attendance`, `/migration`,
        # `/admin/users`).  The Vite dev proxy in apps/web/vite.config.ts is
        # the canonical contract — every prefix there must be routed to the
        # API here, or the zero-touch stack returns the SPA's index.html
        # instead of API JSON (breaking login and every data call).
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /auth/ {
            # /auth/login is not an SPA route; always the API.
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Shared SPA/API prefixes (content negotiation) ─────────
        # /students, /attendance, /migration, /admin are BOTH SPA routes
        # (React Router paths in App.tsx) and API prefixes the http-client
        # fetches bare.  nginx picks the target by the Accept header: a real
        # browser navigation always sends `text/html` (serve the app shell),
        # while fetch() sends `*/*` or `application/json` (proxy to the API).
        location ~ ^/(students|attendance|migration|admin)(/|$) {
            if ($http_accept ~* "text/html") {
                proxy_pass http://web:8080;
                break;
            }
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Docs (development only) ----
        location /docs {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Health / readiness / metrics ----
        location /health {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- SPA ----
        location / {
            proxy_pass http://web:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}