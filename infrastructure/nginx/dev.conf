# =============================================================
# SDMAS v2 — Development Nginx Configuration
# =============================================================
# This config is used by the `docker compose up --build` zero-touch
# experience.  It serves the built SPA and proxies /api/ to the
# FastAPI backend.  No SSL, no HTTPS redirect, no rate limiting.
# For production, see infrastructure/nginx/nginx.conf.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens off;

    # ---- Health check (no auth) ----
    server {
        listen 80 default_server;
        server_name _;

        location /health-check {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- API Proxy ----
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ---- Docs (development only) ----
        location /docs {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Health / readiness / metrics ----
        location /health {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- SPA ----
        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}