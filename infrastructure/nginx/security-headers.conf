# Shared security headers for the outer reverse proxy (nginx.conf).
#
# IMPORTANT nginx gotcha: a location that declares ANY `add_header` stops
# inheriting server-level `add_header` directives.  This file is `include`d
# at the server level AND inside every location that sets its own
# `add_header` (static assets / SPA), so the headers — including the
# Content-Security-Policy — are actually emitted everywhere.
#
# X-Content-Type-Options / X-Frame-Options / X-XSS-Protection /
# Referrer-Policy / Permissions-Policy are also emitted by the API's
# security-headers middleware for /api responses; the nginx copies cover
# the SPA responses (which bypass the API) and error pages.
#
# CSP is ENFORCED with a policy derived from the app's actual needs.
# Unavoidable exceptions (see infrastructure/nginx/README.md):
#   * style-src 'unsafe-inline'          — React inline style attributes
#   * connect-src https://api.razorpay.com — Razorpay checkout
#   * img-src data: blob:                — inline icons / avatar blobs
#   * upgrade-insecure-requests          — HTTPS-only production
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
