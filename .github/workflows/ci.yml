# =============================================================================
# SDMAS v2 — Continuous Integration
# =============================================================================
#
# Pipeline overview:
#   api           — lint (changed files), format (changed files), type check
#                   (changed files), unit + security + async suites, migration
#                   validation against PostgreSQL
#   web           — dependency install from lockfile, type check, tests,
#                   production build, npm audit (high/critical)
#   mobile        — dependency install from lockfile, type check, tests
#   security      — secret scanning (Gitleaks), .env tracking guard
#
# Design notes:
#   * Lint/format/mypy run on **changed files only** because the repository
#     carries substantial pre-existing lint debt (762 app + 431 test ruff
#     findings at the time this workflow was introduced).  CI fails on NEW
#     violations in the files a change touches, without demanding a
#     full-repo cleanup in the same PR.  Full-repo cleanup is tracked
#     separately (docs/SECRETS.md and the hardening backlog).
#   * The unit/security suites run on SQLite (in-memory) — no external
#     services required.
#   * Migration validation runs against a PostgreSQL service container,
#     because parts of the migration chain cannot run on SQLite (the
#     documented limitation).  Production and CI both use PostgreSQL.
#   * Integration tests (testcontainers / Docker) are excluded from the
#     default run; they need Docker-in-Docker and are covered by the
#     dedicated `integration` job.
#
# Secrets: no real credentials are required.  All settings used in CI are
# development/test defaults — never production values.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development/test-only settings.  NEVER put production secrets here.
  ENVIRONMENT: test
  DEBUG: "true"

jobs:
  api:
    name: API (lint, type, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv (lockfile-managed install)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Determine changed Python files
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE...HEAD" -- '*.py' '*.pyi' || true)
          echo "Changed Python files:"
          echo "$CHANGED"
          echo "python_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF"

      - name: Ruff lint (changed files)
        run: |
          FILES=$(echo "${{ steps.changed.outputs.python_files }}" | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "No changed Python files to lint"; exit 0; fi
          uv run ruff check $FILES

      - name: Ruff format check (changed files)
        run: |
          FILES=$(echo "${{ steps.changed.outputs.python_files }}" | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "No changed Python files to format-check"; exit 0; fi
          uv run ruff format --check $FILES

      - name: Mypy type check (changed files)
        run: |
          FILES=$(echo "${{ steps.changed.outputs.python_files }}" | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "No changed Python files to type-check"; exit 0; fi
          uv run mypy --no-incremental $FILES --follow-imports=skip

      - name: Run test suite (unit + security + async; SQLite in-memory)
        run: uv run pytest tests -q -m "not integration"

  api-integration:
    name: API integration tests (Docker/Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies including integration extras
        run: uv sync --frozen --all-extras

      - name: Run integration tests
        run: uv run pytest tests -q -m integration

  migrations:
    name: Migration validation (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdmas
          POSTGRES_PASSWORD: sdmas_dev
          POSTGRES_DB: sdmas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdmas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://sdmas:sdmas_dev@localhost:5432/sdmas
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Verify single migration head
        run: |
          HEADS=$(uv run alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "Expected exactly one migration head, found $HEADS"
            uv run alembic heads
            exit 1
          fi

      - name: Upgrade database to head
        run: uv run alembic upgrade head

  docker-build:
    name: Docker images (build + healthcheck smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Every image must build from a clean checkout — a Dockerfile regression
      # (base image, COPY paths, build args) must fail CI, not first appear at
      # deploy time.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: sdmas-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.worker
          push: false
          load: true
          tags: sdmas-worker:ci
          cache-from: type=gha

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: sdmas-web:ci
          cache-from: type=gha

      - name: Smoke-test images (healthcheck shape)
        run: |
          docker run --rm --entrypoint python sdmas-api:ci -c "import app.main; print('api ok')"
          docker run --rm --entrypoint nginx sdmas-web:ci -t 2>&1 | grep -q "syntax is ok" && echo "web nginx ok"

  web:
    name: Web (type, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (high/critical only)
        run: npm audit --audit-level=high

  mobile:
    name: Mobile (type, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        # Deliberately NOT --passWithNoTests: a zero-test suite must fail the
        # build so test coverage cannot silently disappear.
        run: npx jest

  security:
    name: Security (secret scan, .env guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (license-free CLI via container)
        run: |
          # The official gitleaks-action requires a GITLEAKS_LICENSE secret for
          # organisation repositories, which a fresh clone cannot provide.
          # The gitleaks CLI itself is free and license-free: run it through
          # the official container image instead, so the gate works for any
          # acquirer without configuring secrets.
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect --source /repo --no-banner --redact

      - name: Ensure no environment files are tracked by Git
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example' || true)
          if [ -n "$TRACKED" ]; then
            echo "Secret-bearing environment files are tracked by Git:"
            echo "$TRACKED"
            echo "Remove them with: git rm --cached <file>"
            exit 1
          fi
          echo "No secret-bearing .env files tracked."

      - name: Scan for hardcoded credential patterns
        run: |
          # Fails on obvious live-credential patterns (Razorpay live keys,
          # AWS access keys, GitHub tokens, Google API keys, JWT prod secrets).
          MATCHES=$(grep -rInE \
            'sk_live_[a-zA-Z0-9]{10,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' \
            apps infrastructure scripts . --include='*.py' --include='*.ts' \
            --include='*.tsx' --include='*.js' --include='*.yml' --include='*.yaml' \
            --include='*.toml' --include='*.env.example' 2>/dev/null | \
            grep -v node_modules | grep -v '\.git/' || true)
          if [ -n "$MATCHES" ]; then
            echo "Hardcoded credential pattern(s) found (values redacted):"
            echo "$MATCHES" | sed -E 's/(sk_live_|AKIA|ghp_|AIza)[a-zA-Z0-9_-]+/\1<REDACTED>/g'
            exit 1
          fi
          echo "No hardcoded credential patterns found."

  evidence:
    name: Security evidence (bandit, pip-audit, SBOM, gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies including security scanners
        run: uv sync --frozen --extra dev

      # Gate 1 — Bandit SAST: fail on HIGH-severity findings.
      # bandit exits non-zero when ANY finding exists (even 0 HIGH), so the
      # report is always written and the JSON is the gate — the documented
      # policy is HIGH-only (see docs/security-policy.md).
      - name: Bandit (Python SAST)
        run: |
          uv run bandit -r app -f json -o ../bandit.json -q || true
          HIGH=$(uv run python -c \
            "import json; d=json.load(open('../bandit.json')); \
            print(len([r for r in d['results'] if r['issue_severity']=='HIGH']))")
          echo "Bandit: HIGH=$HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Bandit found HIGH-severity findings — fix or waive via docs/security-policy.md"
            exit 1
          fi

      # Gate 2 — pip-audit: fail on any known dependency vulnerability.
      # Accepted-risk waivers live in docs/security-policy.md and are
      # supplied via the PIP_AUDIT_IGNORE list below.
      - name: pip-audit (Python dependency vulnerabilities)
        run: |
          uv export --format requirements-txt --no-dev -o ../requirements-audit.txt
          uv run pip-audit -r ../requirements-audit.txt --format json -o ../pip-audit.json \
            --ignore-vuln PYSEC-2026-1325 || true
          VULNS=$(uv run python -c \
            "import json; d=json.load(open('../pip-audit.json')); \
            print(sum(1 for dep in d.get('dependencies',[]) if dep.get('vulns')))")
          echo "pip-audit: vulnerable packages=$VULNS (waived ids excluded)"
          if [ "$VULNS" -gt 0 ]; then
            echo "::error::pip-audit found un-waived vulnerabilities — see docs/security-policy.md"
            exit 1
          fi

      # Gate 3 — SBOM: schema validation + determinism (existing job gates
      # byte-reproducibility; this step re-validates from this checkout).
      - name: SBOM validation
        run: |
          bash ../scripts/python_sbom.sh
          bash ../scripts/node_sbom.sh
          cd ..
          SOURCE_DATE_EPOCH=0 python -m sbom.cli generate --output-dir sbom/output
          python -m sbom.cli validate --dir sbom/output

      # Gate 4 — evidence package integrity: checksums + manifest build.
      - name: Build evidence package manifest
        run: |
          cd ..
          bash scripts/security-audit.sh --ci-evidence-only
          PYTHONPATH=scripts python -m evidence.cli checksums --dir artifacts
          echo "Evidence package built: $(ls artifacts/SHA256SUMS)"
