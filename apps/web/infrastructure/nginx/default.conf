# =============================================================
# SDMAS v2 — Web (SPA) container Nginx config
# =============================================================
# Serves the built Vite application.  The SPA responses bypass the
# API's security-headers middleware, so THIS config must carry the
# security headers (including the Content-Security-Policy) itself.
#
# CSP is ENFORCED (not report-only) with a policy derived from the
# app's actual resource needs; the unavoidable exceptions are:
#   * style-src 'unsafe-inline'  — React inline style attributes are
#     used pervasively; removing them is a large front-end refactor.
#   * connect-src https://api.razorpay.com — Razorpay payment checkout.
#   * img-src data: blob:        — inline icons / avatar blobs.
#   * upgrade-insecure-requests  — production is HTTPS-only.
# See infrastructure/nginx/README.md for the enforcement history.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # ---- Security headers (always, so 404/5xx responses carry them) ----
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Health check for the container HEALTHCHECK.
    location = /health-check {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed, immutable build assets (Vite emits these under /assets/).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA artifacts (service worker must be revalidated, never cached long).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(?:webmanifest|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html.
    location / {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
