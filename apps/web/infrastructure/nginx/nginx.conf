# =============================================================
# SDMAS v2 — Web (SPA) container main Nginx config
# =============================================================
# The container runs nginx as the unprivileged `sdmas` user, so the
# master process needs a writable pid path (/tmp) and must not try to
# drop privileges via a `user` directive (that requires root).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
