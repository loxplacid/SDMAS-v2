<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SDMAS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SDMAS" />
    <meta name="description" content="School Data Management & Analytics System — manage students, academics, attendance, fees, and analytics." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-512.svg" />
    <link rel="mask-icon" href="/icons/icon-512.svg" color="#3b82f6" />
    <title>SDMAS</title>

    <!-- Blocking script to prevent flash of wrong theme -->
    <script>
      (function() {
        var isDark = false;
        try { var stored = localStorage.getItem('sdmas-theme'); if (stored === 'dark') isDark = true; else if (stored === 'light') isDark = false; else isDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
        catch(e) { isDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#0b0f1e' : '#f8fafc');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
